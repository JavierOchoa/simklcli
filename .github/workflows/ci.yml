name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src tests scripts

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.3
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest

  artifacts:
    name: Build and smoke-test artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.3
      - run: uv lock --check
      - run: uv build --no-sources
      - name: Smoke-test wheel
        shell: bash
        run: |
          uv venv .smoke-wheel
          uv pip install --python .smoke-wheel/bin/python dist/*.whl
          .smoke-wheel/bin/simkl --help
      - name: Smoke-test source distribution
        shell: bash
        run: |
          uv venv .smoke-sdist
          uv pip install --python .smoke-sdist/bin/python dist/*.tar.gz
          .smoke-sdist/bin/simkl --help

  aggregate:
    name: CI
    if: always()
    needs: [quality, tests, artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge gate
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$ARTIFACTS" = success
