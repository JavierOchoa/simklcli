name: Live pre-release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simkl-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: simkl-smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.3
      - run: uv sync --locked
      - name: Exercise core loop and restore reserved Movie
        env:
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_SMOKE_ACCESS_TOKEN }}
          SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
          SIMKL_SMOKE_ACCOUNT_ID: ${{ vars.SIMKL_SMOKE_ACCOUNT_ID }}
          SIMKL_SMOKE_MEDIA_REFERENCE: ${{ vars.SIMKL_SMOKE_MEDIA_REFERENCE }}
        run: uv run python scripts/live_smoke.py
      - name: Retain restoration backup and success receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-evidence
          path: smoke-*.json
          if-no-files-found: ignore
          retention-days: 30
